<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Studio — Professional CV Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f1f5f9;
      --surface: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --kofi-color: #ff5e5b;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --radius: 10px;
      --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg-canvas); color: var(--text-main); padding: 20px 12px; min-height: 100vh; }

    .resume-container {
      max-width: 850px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 40px;
      border: 1px solid var(--border-light);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 1.5px solid var(--border-light);
      padding-bottom: 8px;
      margin: 28px 0 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-main);
      background: #fafafa;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .dynamic-item {
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      margin-bottom: 16px;
      position: relative;
    }

    /* Buttons */
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { background: #f1f5f9; }

    .btn-kofi {
      background: var(--kofi-color);
      color: white;
    }
    .btn-kofi:hover { background: #e04845; }

    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger:hover { background: #fca5a5; }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border-light);
      flex-wrap: wrap;
      gap: 12px;
    }

    .action-buttons-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .resume-container { padding: 16px 12px; }
      .grid-2 { grid-template-columns: 1fr; }
      .actions-bar { flex-direction: column; align-items: stretch; }
      .action-buttons-group { flex-direction: column; width: 100%; }
      .actions-bar a, .actions-bar button { width: 100%; }
    }

    @media print {
      body { background: white; padding: 0; }
      .resume-container { border: none; box-shadow: none; padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
      input, textarea { border: none !important; background: transparent !important; padding: 0 !important; box-shadow: none !important; }
      .dynamic-item { border: none; background: transparent; padding: 0; margin-bottom: 12px; }
    }
  </style>
</head>
<body>

  <div class="resume-container">
    <div class="top-header">
      <div class="brand-title">
        <h1>RESUME STUDIO</h1>
        <p>Professional CV & Portfolio Builder</p>
      </div>
    </div>

    <!-- Personal Details -->
    <div class="section-title">Personal Information</div>
    <div class="grid-2">
      <div class="field-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. April Arenas" />
      </div>
      <div class="field-group">
        <label>Job Title / Profession</label>
        <input type="text" id="jobTitle" placeholder="e.g. Full Stack Developer" />
      </div>
    </div>
    <div class="grid-2">
      <div class="field-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="field-group">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="+63 900 000 0000" />
      </div>
    </div>
    <div class="field-group">
      <label>Professional Summary</label>
      <textarea id="summary" rows="3" placeholder="Write a short, powerful summary of your experience and career goals..."></textarea>
    </div>

    <!-- Work Experience Section -->
    <div class="section-title">
      <span>Work Experience</span>
      <button class="btn btn-secondary no-print" style="padding: 6px 12px; font-size: 12px;" onclick="addExperience()">+ Add Role</button>
    </div>
    <div id="experienceContainer"></div>

    <!-- Education Section -->
    <div class="section-title">
      <span>Education</span>
      <button class="btn btn-secondary no-print" style="padding: 6px 12px; font-size: 12px;" onclick="addEducation()">+ Add School</button>
    </div>
    <div id="educationContainer"></div>

    <!-- Action Bar & Ko-fi -->
    <div class="actions-bar no-print">
      <a href="https://ko-fi.com/handlevault" target="_blank" class="btn btn-kofi">
        ☕ Support on Ko-fi
      </a>
      
      <div class="action-buttons-group">
        <button class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
        <button class="btn" onclick="window.print()">Print / Export PDF</button>
      </div>
    </div>
  </div>

  <script>
    let experiences = [
      { role: "Software Developer", company: "Tech Solutions", period: "2024 - Present", details: "Developed and deployed scalable web applications." }
    ];

    let educations = [
      { degree: "Bachelor of Science in Information Technology", school: "University", period: "2020 - 2024" }
    ];

    function renderExperience() {
      const container = document.getElementById('experienceContainer');
      container.innerHTML = '';
      experiences.forEach((exp, idx) => {
        const div = document.createElement('div');
        div.className = 'dynamic-item';
        div.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;" class="no-print">
            <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);">Role #${idx + 1}</span>
            <button class="btn-danger" onclick="removeExperience(${idx})">Remove</button>
          </div>
          <div class="grid-2" style="margin-bottom: 12px;">
            <div class="field-group"><label>Job Title</label><input type="text" value="${exp.role}" oninput="updateExp(${idx}, 'role', this.value)" /></div>
            <div class="field-group"><label>Company / Organization</label><input type="text" value="${exp.company}" oninput="updateExp(${idx}, 'company', this.value)" /></div>
          </div>
          <div class="field-group" style="margin-bottom: 12px;"><label>Period</label><input type="text" value="${exp.period}" oninput="updateExp(${idx}, 'period', this.value)" /></div>
          <div class="field-group"><label>Key Responsibilities & Achievements</label><textarea rows="2" oninput="updateExp(${idx}, 'details', this.value)">${exp.details}</textarea></div>
        `;
        container.appendChild(div);
      });
    }

    function renderEducation() {
      const container = document.getElementById('educationContainer');
      container.innerHTML = '';
      educations.forEach((edu, idx) => {
        const div = document.createElement('div');
        div.className = 'dynamic-item';
        div.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;" class="no-print">
            <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);">Education #${idx + 1}</span>
            <button class="btn-danger" onclick="removeEducation(${idx})">Remove</button>
          </div>
          <div class="grid-2" style="margin-bottom: 12px;">
            <div class="field-group"><label>Degree / Course</label><input type="text" value="${edu.degree}" oninput="updateEdu(${idx}, 'degree', this.value)" /></div>
            <div class="field-group"><label>School / Institution</label><input type="text" value="${edu.school}" oninput="updateEdu(${idx}, 'school', this.value)" /></div>
          </div>
          <div class="field-group"><label>Period</label><input type="text" value="${edu.period}" oninput="updateEdu(${idx}, 'period', this.value)" /></div>
        `;
        container.appendChild(div);
      });
    }

    function addExperience() {
      experiences.push({ role: "", company: "", period: "", details: "" });
      renderExperience();
    }
    function removeExperience(idx) {
      experiences.splice(idx, 1);
      renderExperience();
    }
    function updateExp(idx, field, val) { experiences[idx][field] = val; }

    function addEducation() {
      educations.push({ degree: "", school: "", period: "" });
      renderEducation();
    }
    function removeEducation(idx) {
      educations.splice(idx, 1);
      renderEducation();
    }
    function updateEdu(idx, field, val) { educations[idx][field] = val; }

    function saveDraft() {
      const data = {
        fullName: document.getElementById('fullName').value,
        jobTitle: document.getElementById('jobTitle').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        summary: document.getElementById('summary').value,
        experiences,
        educations
      };
      localStorage.setItem('resume_draft', JSON.stringify(data));
      alert('Resume draft saved successfully in browser!');
    }

    function loadDraft() {
      const saved = localStorage.getItem('resume_draft');
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('fullName').value = data.fullName || '';
        document.getElementById('jobTitle').value = data.jobTitle || '';
        document.getElementById('email').value = data.email || '';
        document.getElementById('phone').value = data.phone || '';
        document.getElementById('summary').value = data.summary || '';
        if (data.experiences && data.experiences.length) experiences = data.experiences;
        if (data.educations && data.educations.length) educations = data.educations;
      }
    }

    window.onload = () => {
      loadDraft();
      renderExperience();
      renderEducation();
    };
  </script>
</body>
</html>
